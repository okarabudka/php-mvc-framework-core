name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - name: PSR-4 autoloading on a case-sensitive file system
        run: composer dump-autoload -o --strict-psr
      - name: Code style
        run: composer cs
      - name: Static analysis
        run: composer stan
      - name: Tests with coverage
        run: |
          set -o pipefail
          composer coverage | tee coverage.txt
      - name: Report
        if: always()
        run: |
          {
            echo '### Coverage'
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' coverage.txt | grep -E '^\s+(Classes|Methods|Lines):' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
